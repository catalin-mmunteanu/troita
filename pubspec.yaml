name: troita
description: Vă anunță discret când treceți pe lângă o biserică ortodoxă.
publish_to: "none"
version: 0.1.0+1

environment:
  # 3.6 is the floor for Color.withValues(); anything older forces
  # the deprecated withOpacity() throughout the theme.
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Reads the same SQLite file the native background path writes. Deliberately
  # the only data dependency: no ORM, no code generation, no second schema.
  sqflite: ^2.3.3
  # Direct dependency again: user_database.dart joins the database path.
  path: ^1.9.0

  # Runtime permissions. The background-location flow in particular is fiddly
  # enough (settings-page redirect on API 30+) that hand-rolling it is a trap.
  permission_handler: ^11.3.1

  intl: ^0.20.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  shared_preferences: ^2.5.5

  # The map. Native MapLibre, so the ~20k churches are clustered and drawn on
  # the GPU rather than as Flutter widgets — a marker per church in Dart would
  # not survive a zoomed-out view of the whole country.
  #
  # This one forces the toolchain: its Android module compiles at Java 21 and
  # pins NDK 28.1.13356709, which is why app/build.gradle.kts moved off 17.
  # Requires JDK 21 on the build machine.
  maplibre_gl: ^0.27.1

  # Added with `flutter pub add` rather than pinned here by hand — see the
  # command in README. Listing a version I guessed at is how this project has
  # broken twice already.
  #   flutter_local_notifications   scheduling, channels
  #   timezone                      Romania observes DST, so a fixed offset
  #                                 would drift by an hour twice a year.
  #                                 flutter_timezone was REMOVED — it pins
  #                                 Kotlin 1.7.10 / AGP 7.3.0 in its own
  #                                 buildscript and cannot compile against a
  #                                 modern toolchain. See local_timezone.dart.
  #   shared_preferences            notification settings

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Runs the real SQL against an in-memory SQLite on the host, so the
  # repository tests exercise production queries rather than a fake.
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/churches/
    # Saint images from the sinaxar scrape. Flat, with a MM-DD prefix, because
    # Flutter does not recurse into subdirectories — one line instead of 293.
    - assets/sinaxar/

  # Uncomment once the .ttf files are in assets/fonts/ — see the README there.
  # Until then Flutter falls back to the platform font, which is a warning
  # rather than a build failure, so the app runs either way.
  #
  # fonts:
  #   - family: Fraunces
  #     fonts:
  #       - asset: assets/fonts/Fraunces-VariableFont.ttf
  #       - asset: assets/fonts/Fraunces-Bold.ttf
  #         weight: 700
  #   - family: Geist
  #     fonts:
  #       - asset: assets/fonts/Geist-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Geist-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Geist-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Geist-Bold.ttf
  #         weight: 700
