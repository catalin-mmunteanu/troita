org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# ---------------------------------------------------------------- Kotlin
#
# flutter_timezone 5.1.0 carries its own buildscript block pinning Kotlin
# Gradle Plugin 1.7.10 and AGP 7.3.0, against this project's 2.2.20 / 8.11.1.
# Two Kotlin plugin versions on one classpath produces
# "Daemon compilation failed: null", with an AssertionError from
# IncrementalCachesManager.close as the visible symptom.
#
# Two settings remove the failure rather than paper over it:

# 1. No incremental caches, so the code path that throws cannot run. The error
#    originates in IncrementalCachesManager.close — with incremental off there
#    are no caches to close.
kotlin.incremental=false

# 2. Compile inside the Gradle daemon instead of spawning a separate Kotlin
#    daemon. Removes the cross-process version negotiation that the mismatch
#    breaks, which is why the message ends in "null" — the daemon died before
#    it could report anything useful.
#    Costs a slower first build and needs the larger heap set above.
kotlin.compiler.execution.strategy=in-process
